<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vineet &amp; Neha — May 29, 2027</title>
  <meta name="description" content="Wedding logistics for Vineet &amp; Neha — May 29, 2027, Brooklyn, New York." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navigation -->
  <nav>
    <div class="nav-inner">
      <a href="#hero" class="nav-brand">V &amp; N</a>
      <ul class="nav-links">
        <li><a href="#schedule">Schedule</a></li>
        <li><a href="#venue">Venue</a></li>
        <li><a href="#hotels">Hotels</a></li>
        <li><a href="#faq">FAQ</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <!-- Hero -->
    <section id="hero">
      <div class="container">
        <p class="hero-eyebrow">You are invited to celebrate</p>
        <h1 class="hero-names">
          <span id="hero-p1"></span>
          <span class="hero-amp">&amp;</span>
          <span id="hero-p2"></span>
        </h1>
        <div class="hero-meta">
          <span class="hero-date" id="hero-date"></span>
          <span class="hero-location">Brooklyn, New York</span>
        </div>
        <div class="hero-rule"></div>
      </div>
    </section>

    <!-- Schedule -->
    <section id="schedule">
      <div class="container">
        <p class="section-label">On the day</p>
        <h2 class="section-title">Schedule</h2>
        <ul class="schedule-list" id="schedule-list"></ul>
      </div>
    </section>

    <!-- Venue -->
    <section id="venue">
      <div class="container">
        <p class="section-label">Getting there</p>
        <h2 class="section-title">Venue</h2>
        <p class="venue-address" id="venue-address"></p>
        <a class="map-link" id="venue-map" href="#" target="_blank" rel="noopener">
          Open in Maps ↗
        </a>
      </div>
    </section>

    <!-- Dress Code -->
    <section id="dresscode">
      <div class="container">
        <p class="section-label">What to wear</p>
        <h2 class="section-title">Dress Code</h2>
        <p class="dresscode-text" id="dresscode-text"></p>
      </div>
    </section>

    <!-- Hotels -->
    <section id="hotels">
      <div class="container">
        <p class="section-label">Where to stay</p>
        <h2 class="section-title">Hotels</h2>
        <ul class="hotel-list" id="hotel-list"></ul>
      </div>
    </section>

    <!-- FAQ -->
    <section id="faq">
      <div class="container">
        <p class="section-label">Good to know</p>
        <h2 class="section-title">FAQ</h2>
        <ul class="faq-list" id="faq-list"></ul>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p class="footer-names" id="footer-names"></p>
      <p class="footer-date" id="footer-date"></p>
    </div>
  </footer>

  <!-- Content data -->
  <script src="content.js"></script>

  <!-- Render -->
  <script>
    // Hero
    document.getElementById("hero-p1").textContent = WEDDING.partner1.toUpperCase();
    document.getElementById("hero-p2").textContent = WEDDING.partner2.toUpperCase();
    document.getElementById("hero-date").textContent = WEDDING.date.display;

    // Schedule
    const scheduleList = document.getElementById("schedule-list");
    WEDDING.schedule.forEach(item => {
      const li = document.createElement("li");
      li.className = "schedule-item";
      li.innerHTML = `
        <span class="schedule-time">${item.time}</span>
        <span>
          <span class="schedule-event">${item.event}</span>
          ${item.note ? `<p class="schedule-note">${item.note}</p>` : ""}
        </span>
      `;
      scheduleList.appendChild(li);
    });

    // Venue
    document.getElementById("venue-address").textContent = WEDDING.venue.address;
    const mapLink = document.getElementById("venue-map");
    mapLink.href = WEDDING.venue.mapsUrl;

    // Dress code
    document.getElementById("dresscode-text").textContent = WEDDING.dresscode;

    // Hotels
    const hotelList = document.getElementById("hotel-list");
    WEDDING.hotels.forEach(hotel => {
      const li = document.createElement("li");
      li.className = "hotel-item";
      li.innerHTML = `
        <p class="hotel-name">${hotel.name}</p>
        <p class="hotel-address">${hotel.address}</p>
        ${hotel.note ? `<p class="hotel-note">${hotel.note}</p>` : ""}
        <a class="hotel-maps" href="${hotel.mapsUrl}" target="_blank" rel="noopener">Directions ↗</a>
      `;
      hotelList.appendChild(li);
    });

    // FAQ
    const faqList = document.getElementById("faq-list");
    WEDDING.faq.forEach(item => {
      const li = document.createElement("li");
      li.className = "faq-item";
      li.innerHTML = `
        <p class="faq-q">${item.q}</p>
        <p class="faq-a">${item.a}</p>
      `;
      faqList.appendChild(li);
    });

    // Footer
    document.getElementById("footer-names").textContent =
      `${WEDDING.partner1} & ${WEDDING.partner2}`;
    document.getElementById("footer-date").textContent = WEDDING.date.display + " · Brooklyn, New York";
  </script>

</body>
</html>
